name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos, unitários e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm audit --omit=dev --audit-level=high

  integration-e2e:
    name: Integração (banco real) e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Supabase local (Postgres, Auth, Storage, Mailpit) — nunca aponta para produção.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime
      - run: npm run env:local
      - run: npm run test:integration
      - run: npm run build
      - run: npm run seed:demo
      - run: npx playwright install --with-deps chromium
      - name: Aguarda o clamd carregar as assinaturas (se não subir, os arquivos ficam em quarentena)
        run: |
          for i in $(seq 1 60); do
            if printf 'zPING\0' | nc -w 2 127.0.0.1 3310 | grep -q PONG; then echo "clamd pronto"; exit 0; fi
            sleep 5
          done
          echo "clamd indisponível: comprovantes ficarão em quarentena durante o E2E"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
